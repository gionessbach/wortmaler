<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortmaler">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F7FB">
<title>Wortmaler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: ein Bildschirm – oben Umschalter und Modi, riesige Schreibfläche, unten Löschen · Mikrofon · Alles löschen */
  :root{
    --paper:#F4F7FB;      /* Hintergrund */
    --sheet:#FFFFFF;      /* Schreibfläche */
    --ink:#1D2742;        /* fertige Wörter */
    --ink-live:#A3AEC4;   /* Wort, das gerade erkannt wird */
    --line:#DDE4EF;       /* Ränder, Knöpfe */
    --mic:#F2603F;
    --mic-on:#D93B1B;
    --syl-a:#1E5BD8;      /* Silbe blau */
    --syl-b:#D62839;      /* Silbe rot */
    --hl:#FFE27A;         /* Hervorhebung beim Vorlesen */
    --ok:#2E9E6B;
    --font-kid:"Andika","Comic Neue",system-ui,-apple-system,sans-serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  [hidden]{display:none!important}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font-ui);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;overflow:hidden;
  }
  .app{
    height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:16px;
    padding-top:max(16px, env(safe-area-inset-top,0px));
    padding-bottom:max(16px, env(safe-area-inset-bottom,0px));
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  /* Obere Leiste */
  .bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .group{display:flex;align-items:center;gap:12px}
  .toggle{display:flex;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px}
  .toggle button{
    font-family:var(--font-kid);font-size:28px;font-weight:700;color:var(--ink-live);
    background:none;border:0;border-radius:999px;min-width:96px;height:56px;padding:0 18px;cursor:pointer;
    transition:background .2s,color .2s;
  }
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
  .round,.pill{
    height:64px;border-radius:999px;border:2px solid var(--line);background:var(--sheet);
    display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--ink);
    transition:background .2s,border-color .2s,color .2s;
  }
  .round{width:64px}
  .pill{padding:0 20px 0 16px;font-family:var(--font-kid);font-size:24px;font-weight:700}
  .round svg,.pill svg{width:30px;height:30px;flex:none}
  .round:disabled{opacity:.35}
  .round[aria-pressed="true"],.pill[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
  .pill[aria-pressed="true"] svg{color:#FFD23F}
  .round.armed{background:var(--mic-on);border-color:var(--mic-on);color:#fff}
  button:focus-visible{outline:4px solid #7AA7FF;outline-offset:3px}

  /* Schreibfläche */
  .stage{
    position:relative;min-height:0;background:var(--sheet);border-radius:28px;border:2px solid var(--line);
    padding:clamp(16px,3vw,40px);overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .text{font-family:var(--font-kid);font-weight:400;line-height:1.15;text-align:center;max-width:100%}
  .text.lined{width:100%;line-height:1.5;background-repeat:repeat-y;background-position:0 0}
  .w{display:inline-block;padding:0 .1em;border-radius:.15em;cursor:pointer;white-space:nowrap;transition:background .2s}
  .l{display:inline-block;border-radius:.12em;transition:background .15s,transform .15s}
  .syl .l.s0{color:var(--syl-a)}
  .syl .l.s1{color:var(--syl-b)}
  .w.live,.w.live .l{color:var(--ink-live)!important}
  .l.hl{background:var(--hl);transform:translateY(-.06em)}
  .w.speaking{background:var(--hl)}
  .l.ap{animation:ap .4s ease-out backwards}
  @keyframes ap{from{color:var(--ink-live);transform:scale(.55) translateY(.15em)}}

  .hint{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    color:var(--ink-live);font-size:20px;text-align:center;padding:24px;pointer-events:none;
  }
  .hint svg{width:120px;height:120px;color:var(--line)}
  .msg{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 32px);z-index:3;
    background:var(--ink);color:#fff;font-size:17px;line-height:1.4;padding:12px 18px;border-radius:14px;text-align:center;
  }

  /* Profi-Modus */
  .timer{position:absolute;left:0;top:0;height:10px;width:100%;background:var(--syl-a);z-index:2}
  .cover{
    position:absolute;inset:0;z-index:2;background:var(--sheet);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;text-align:center;
  }
  .cover .big{font-family:var(--font-kid);font-weight:700;font-size:clamp(30px,4.5vw,48px);color:var(--ink)}
  .cover .pencil{width:110px;height:110px;color:var(--syl-b)}
  .reveal{
    width:128px;height:128px;border-radius:50%;border:0;cursor:pointer;background:var(--syl-a);color:#fff;
    display:grid;place-items:center;box-shadow:0 6px 0 #1442A0;transition:transform .1s,box-shadow .1s;
  }
  .reveal:active{transform:translateY(4px);box-shadow:0 2px 0 #1442A0}
  .reveal svg{width:60px;height:60px}

  /* Untere Leiste */
  .controls{display:flex;justify-content:center;align-items:center;gap:clamp(24px,5vw,48px)}
  .mic{
    position:relative;width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;
    background:var(--mic);color:#fff;display:grid;place-items:center;
    box-shadow:0 6px 0 #C2462A;transition:transform .1s,box-shadow .1s,background .2s;
  }
  .mic:active{transform:translateY(4px);box-shadow:0 2px 0 #C2462A}
  .mic svg{width:52px;height:52px;position:relative;z-index:1}
  .mic.on{background:var(--mic-on);box-shadow:0 6px 0 #9E2A12}
  .mic.on::before,.mic.on::after{
    content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--mic);animation:ring 1.6s ease-out infinite;
  }
  .mic.on::after{animation-delay:.8s}
  @keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}

  /* Einstellungen (für Eltern) */
  .scrim{
    position:fixed;inset:0;z-index:10;background:rgba(29,39,66,.28);display:flex;justify-content:flex-end;align-items:flex-start;
    padding-top:max(16px, env(safe-area-inset-top,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-bottom:16px;
  }
  .panel{
    width:min(380px,100%);background:var(--sheet);border-radius:22px;padding:20px 22px;
    box-shadow:0 16px 48px rgba(29,39,66,.22);display:flex;flex-direction:column;
  }
  .panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .panel h2{margin:0;font-size:21px;font-weight:700}
  .x{width:44px;height:44px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:22px;cursor:pointer}
  .opt{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);font-size:18px;cursor:pointer}
  .opt small{display:block;color:#6B7690;font-size:14px;margin-top:2px}
  .switch{-webkit-appearance:none;appearance:none;width:54px;height:32px;border-radius:999px;background:var(--line);position:relative;cursor:pointer;transition:background .2s;flex:none;margin:0}
  .switch::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
  .switch:checked{background:var(--ok)}
  .switch:checked::after{transform:translateX(22px)}
  .print{margin-top:18px;height:54px;border-radius:14px;border:0;background:var(--ink);color:#fff;font-size:18px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .print svg{width:24px;height:24px}

  @media (prefers-reduced-motion:reduce){
    .mic.on::before,.mic.on::after{animation:none;opacity:.5;transform:scale(1.2)}
    .l.ap{animation-duration:.01s}
  }

  /* Ersatz-Eingabe, falls der Browser keine Spracherkennung hat */
  .fallback{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;font-size:16px}

  /* Arbeitsblatt */
  #sheet{display:none}
  .ws-head{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--font-kid);color:var(--ink);margin-bottom:8mm}
  .ws-head h1{font-size:30px;margin:0}
  .ws-head span{font-size:14px;color:#6B7690}
  .ws-item{break-inside:avoid;page-break-inside:avoid;margin-bottom:7mm}
  .row{position:relative}
  .row .band{position:absolute;left:0;right:0;background:#EEF3FB}
  .row .ln{position:absolute;left:0;right:0;border-top:1px solid #9DB3D6}
  .row .ln.base{border-top:2px solid #5F7FB5}
  .row .tx{position:absolute;left:5mm;font-family:var(--font-kid);white-space:nowrap;color:var(--ink)}
  @media print{
    @page{size:A4;margin:15mm}
    html,body{height:auto;overflow:visible;background:#fff}
    .app,.scrim{display:none!important}
    #sheet{display:block;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  }
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="toggle" role="group" aria-label="Schreibweise">
      <button id="modeNormal" type="button" aria-pressed="true">Abc</button>
      <button id="modeUpper" type="button" aria-pressed="false">ABC</button>
    </div>
    <div class="group">
      <button id="spellBtn" class="round" type="button" aria-pressed="false" aria-label="Buchstabieren">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7M19.5 5.5a9 9 0 0 1 0 13"/></svg>
      </button>
      <button id="profiBtn" class="pill" type="button" aria-pressed="false" aria-label="Profi-Modus">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.6l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.4l-5.8 3.1 1.1-6.5L2.6 9.4l6.5-.9z"/></svg>
        Profi
      </button>
      <button id="gearBtn" class="round" type="button" aria-label="Einstellungen">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
    </div>
  </div>

  <main class="stage" id="stage">
    <div class="timer" id="timer" hidden></div>
    <div class="text" id="text" aria-live="polite"></div>
    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      <div id="hintText">Drück auf das rote Mikrofon und sag ein Wort.</div>
    </div>
    <div class="cover" id="cover" hidden>
      <svg class="pencil" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-5L16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 2z"/><path d="M14.5 5.5l3 3"/></svg>
      <div class="big">Schreib es auf!</div>
      <button id="revealBtn" class="reveal" type="button" aria-label="Aufdecken">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3" fill="currentColor"/></svg>
      </button>
    </div>
    <div class="msg" id="msg" hidden></div>
    <input id="fallback" class="fallback" type="text" autocomplete="off" autocorrect="off" spellcheck="false" lang="de">
  </main>

  <div class="controls">
    <button id="undoBtn" class="round" type="button" aria-label="Letztes Wort löschen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>
    </button>
    <button id="micBtn" class="mic" type="button" aria-label="Sprechen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    </button>
    <button id="clearBtn" class="round" type="button" aria-label="Alles löschen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
  </div>
</div>

<div class="scrim" id="scrim" hidden>
  <div class="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitle">
    <div class="panel-head">
      <h2 id="panelTitle">Einstellungen</h2>
      <button id="closeBtn" class="x" type="button" aria-label="Schließen">✕</button>
    </div>
    <label class="opt" for="optSyl"><span>Silbenfarben<small>Silben abwechselnd blau und rot</small></span><input id="optSyl" class="switch" type="checkbox"></label>
    <label class="opt" for="optLines"><span>Schreiblinien<small>Linien wie im Schulheft</small></span><input id="optLines" class="switch" type="checkbox"></label>
    <label class="opt" for="optAnim"><span>Buchstaben nacheinander<small>Wörter bauen sich langsam auf</small></span><input id="optAnim" class="switch" type="checkbox"></label>
    <label class="opt" for="optPunct"><span>Satzzeichen automatisch<small>Punkt oder Fragezeichen ab 3 Wörtern</small></span><input id="optPunct" class="switch" type="checkbox"></label>
    <button id="printBtn" class="print" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="7"/></svg>
      Arbeitsblatt drucken
    </button>
  </div>
</div>

<div id="sheet"></div>

<script>
(function(){
  "use strict";

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), textEl = $("text"), hint = $("hint"), hintText = $("hintText"), msg = $("msg");
  var micBtn = $("micBtn"), undoBtn = $("undoBtn"), clearBtn = $("clearBtn");
  var modeNormal = $("modeNormal"), modeUpper = $("modeUpper"), fallback = $("fallback");
  var spellBtn = $("spellBtn"), profiBtn = $("profiBtn"), gearBtn = $("gearBtn");
  var scrim = $("scrim"), closeBtn = $("closeBtn"), printBtn = $("printBtn"), sheet = $("sheet");
  var cover = $("cover"), revealBtn = $("revealBtn"), timerBar = $("timer");
  var optEls = { syl: $("optSyl"), lines: $("optLines"), anim: $("optAnim"), punct: $("optPunct") };

  var MIC_SVG = micBtn.innerHTML;
  var STOP_SVG = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>';

  var words = [];          // fertige Wörter
  var live = "";           // gerade erkannter Text
  var upper = false;
  var spell = false;       // Buchstabier-Modus
  var opt = { syl: true, lines: true, anim: true, punct: true };
  var listening = false, rec = null;

  var profi = false, profiStart = 0, phase = "idle", phaseTimer = null;
  var animFrom = -1, animStart = 0, ANIM_STEP = 140;

  /* ---------- Speichern (nur auf diesem Gerät) ---------- */
  function save(){
    try{ localStorage.setItem("wortmaler", JSON.stringify({words:words, upper:upper, spell:spell, opt:opt})); }catch(e){}
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem("wortmaler") || "null");
      if(!d) return;
      if(Array.isArray(d.words)) words = d.words.filter(function(w){ return typeof w === "string"; });
      upper = !!d.upper; spell = !!d.spell;
      if(d.opt) for(var k in opt) if(typeof d.opt[k] === "boolean") opt[k] = d.opt[k];
    }catch(e){}
  }

  /* ---------- Satzzeichen ---------- */
  // Gesprochene Satzzeichen: "Hallo Punkt" → "Hallo."
  var SPOKEN = {
    "punkt": ".", "komma": ",", "fragezeichen": "?", "ausrufezeichen": "!",
    "doppelpunkt": ":", "semikolon": ";", "strichpunkt": ";"
  };
  var PUNCT_ONLY = /^[.,!?;:…]+$/;
  var PUNCT_END = /[.,!?;:…]+$/;
  var SENT_END = /[.!?…]$/;

  // Automatische Satzzeichen: Fragewort oder Frage-Verb am Satzanfang → "?", sonst "."
  var FRAGEWOERTER = ["wer","wen","wem","wessen","wie","was","wo","warum","wann","welche","welcher","welches","welchen","welchem",
    "wieso","weshalb","weswegen","woher","wohin","wozu","womit","wofür","worüber","worauf","woran","worin","wovon","wieviel","wieviele"];
  var FRAGEVERBEN = ["kann","kannst","können","könnt","darf","darfst","dürfen","dürft","hast","hat","habt","haben","bist","ist","sind","seid",
    "willst","will","wollen","wollt","magst","mag","mögen","möchtest","möchte","gehst","geht","gehen","kommst","kommt","kommen",
    "spielst","spielt","spielen","machst","macht","machen","gibt","gibst","weißt","weiß","wisst","siehst","sieht","hörst","hört",
    "soll","sollst","sollen","sollt","muss","musst","müssen","müsst","wirst","wird","werden","werdet","warst","war","waren",
    "hattest","hatte","hatten","isst","esst","trinkst","heißt","heißt","bleibst","fährst","fahren","liest","schläfst","brauchst",
    "glaubst","findest","kennst","weinst","lachst","tust","tut"];

  function cap(w){
    if(!w || w.indexOf("***") === 0) return w;
    return w.charAt(0).toLocaleUpperCase("de-DE") + w.slice(1);
  }
  function bare(w){ return w.toLowerCase().replace(PUNCT_END, ""); }

  function autoPunct(list, start){
    // Großschreibung nach einem Satzende
    for(var i = Math.max(start, 1); i < list.length; i++){
      if(SENT_END.test(list[i - 1])) list[i] = cap(list[i]);
    }
    if(list.length <= start) return list;
    var last = list[list.length - 1];
    if(PUNCT_END.test(last)) return list;
    // Anfang des letzten Satzes in dieser Aufnahme suchen
    var s = list.length - 1;
    while(s > start && !SENT_END.test(list[s - 1])) s--;
    if(list.length - s < 3) return list;      // einzelne Wörter bekommen kein Satzzeichen
    var first = bare(list[s]);
    var q = FRAGEWOERTER.indexOf(first) >= 0 || FRAGEVERBEN.indexOf(first) >= 0;
    list[list.length - 1] = last + (q ? "?" : ".");
    list[s] = cap(list[s]);
    return list;
  }

  /* ---------- Wortfilter (Jugendschutz) ----------
     Gefilterte Wörter erscheinen als *** und werden nicht vorgelesen.
     Eigene Wörter einfach in EIGENE_WOERTER eintragen, klein geschrieben, ß als ss.
     Beispiel: var EIGENE_WOERTER = ["doofi", "bloedmann"];                        */
  var EIGENE_WOERTER = [];

  // Teil eines Wortes genügt (fängt auch zusammengesetzte Wörter ab)
  var FILTER_ENTHAELT = [
    "scheiss", "scheis", "fick", "fuck", "shit", "bitch", "wichs", "wixer", "wixx", "fotze",
    "hure", "nutte", "schlampe", "arschloch", "missgeburt", "spast", "schwuchtel",
    "kanake", "neger", "pimmel", "muschi", "titte", "piss", "kack",
    "idiot", "trottel", "verpiss", "hackfresse", "miststueck", "miststuck", "drecksau", "bastard",
    "porno", "kotze"
  ];
  // Wort beginnt damit (so bleiben z. B. "Marsch" und "Barsch" erlaubt)
  var FILTER_BEGINNT = ["arsch", "depp", "kotz", "drecks", "blodmann", "bloedmann", "vollpfosten"];
  // nur genau dieses Wort (so bleibt z. B. "fressen" erlaubt)
  var FILTER_GENAU = ["fresse", "penner", "luder"];

  var MASKE = "***";
  function normalize(t){
    return t.toLowerCase().replace(/ß/g, "ss").replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue")
      .replace(/[^a-z*]/g, "");
  }
  function isBad(t){
    var n = normalize(t);
    if(!n) return false;
    if(n.indexOf("*") >= 0) return true;               // schon von Apple maskiert, z. B. "f***"
    var m = n.replace(/ae/g, "a").replace(/oe/g, "o").replace(/ue/g, "u");
    function hit(x){
      if(FILTER_GENAU.indexOf(x) >= 0 || EIGENE_WOERTER.indexOf(x) >= 0) return true;
      for(var i = 0; i < FILTER_BEGINNT.length; i++) if(x.indexOf(FILTER_BEGINNT[i]) === 0) return true;
      for(var j = 0; j < FILTER_ENTHAELT.length; j++) if(x.indexOf(FILTER_ENTHAELT[j]) >= 0) return true;
      for(var k = 0; k < EIGENE_WOERTER.length; k++) if(EIGENE_WOERTER[k] && x.indexOf(EIGENE_WOERTER[k]) >= 0) return true;
      return false;
    }
    return hit(n) || hit(m);
  }
  function censor(t){
    if(!isBad(t)) return t;
    var tail = (t.match(PUNCT_END) || [""])[0];
    return MASKE + tail;
  }

  // Hängt neue Wörter (rohe Spracheingabe) an eine vorhandene Wortliste an.
  // Satzzeichen – gesprochen oder vom Erkenner geliefert – kleben am vorherigen Wort.
  function merge(base, str){
    var out = base.slice();
    var tokens = str
      .replace(/["„“”«»()]/g, " ")
      .replace(/([.,!?;:…])(?=[^\s.,!?;:…*])/g, "$1 ")
      .split(/\s+/)
      .filter(function(t){ return t.length > 0; });
    tokens.forEach(function(t){
      var mark = SPOKEN[bare(t)];
      if(mark !== undefined && out.length){
        out[out.length - 1] = out[out.length - 1].replace(PUNCT_END, "") + mark;
      }else if(PUNCT_ONLY.test(t)){
        if(out.length) out[out.length - 1] += t;
      }else{
        out.push(censor(t));
      }
    });
    return out;
  }

  function show(w){
    if(!upper) return w;
    // ß wird zum großen ẞ statt zu "SS"
    return w.replace(/ß/g, "ẞ").toLocaleUpperCase("de-DE");
  }

  /* ---------- Silben (vereinfachte Regeln der Silbenmethode) ---------- */
  var VOKALE = "aeiouäöüyáàéèíóú";
  var V_EINHEITEN = ["äu","aa","ee","oo","ie","ei","ai","au","eu","ey","ay"];
  var K_EINHEITEN = ["sch","ch","ck","ph","qu","th"];
  var ANLAUTE = ["bl","br","dr","fl","fr","gl","gr","kl","kr","pl","pr","tr","schl","schm","schn","schr","schw"];
  var IS_LETTER = /[a-zäöüßẞáàéèíóúñç]/i;

  function units(s){
    var u = [], i = 0;
    while(i < s.length){
      var m = null, k;
      for(k = 0; k < K_EINHEITEN.length && !m; k++){
        if(s.substr(i, K_EINHEITEN[k].length) === K_EINHEITEN[k]) m = {t:"K", s:i, len:K_EINHEITEN[k].length, txt:K_EINHEITEN[k]};
      }
      for(k = 0; k < V_EINHEITEN.length && !m; k++){
        if(s.substr(i, 2) === V_EINHEITEN[k]) m = {t:"V", s:i, len:2, txt:V_EINHEITEN[k]};
      }
      if(!m) m = {t: VOKALE.indexOf(s[i]) >= 0 ? "V" : "K", s:i, len:1, txt:s[i]};
      u.push(m); i += m.len;
    }
    return u;
  }
  // Positionen, an denen eine neue Silbe beginnt
  function syllableStarts(s){
    var u = units(s), starts = [], lastV = -1;
    for(var j = 0; j < u.length; j++){
      if(u[j].t !== "V") continue;
      if(lastV >= 0){
        var k = u.slice(lastV + 1, j), b;
        if(k.length === 0) b = u[j].s;
        else if(k.length >= 2 && ANLAUTE.indexOf(k[k.length - 2].txt + k[k.length - 1].txt) >= 0) b = k[k.length - 2].s;
        else b = k[k.length - 1].s;
        starts.push(b);
      }
      lastV = j;
    }
    return starts;
  }
  // Für jedes Zeichen: "s0"/"s1" (Silbe blau/rot) oder "p" (kein Buchstabe)
  function syllableClasses(str){
    var lower = str.toLowerCase(), out = [], color = 0, i = 0;
    while(i < lower.length){
      if(!IS_LETTER.test(lower[i])){ out.push("p"); i++; continue; }
      var j = i;
      while(j < lower.length && IS_LETTER.test(lower[j])) j++;
      var starts = syllableStarts(lower.slice(i, j));
      for(var p = i; p < j; p++){
        if(starts.indexOf(p - i) >= 0) color = 1 - color;
        out.push("s" + color);
      }
      color = 1 - color;   // nächstes Wort / nächster Teil beginnt mit der anderen Farbe …
      i = j;
    }
    return out;
  }

  /* ---------- Darstellung ---------- */
  function buildWord(w, isLive){
    var span = document.createElement("span");
    span.className = "w" + (isLive ? " live" : "");
    span.dataset.word = w;
    var disp = show(w);
    if(w.indexOf(MASKE) === 0){ span.classList.add("masked"); span.textContent = disp; return span; }
    var cls = syllableClasses(disp);   // jedes Wort beginnt blau
    for(var k = 0; k < disp.length; k++){
      var l = document.createElement("span");
      l.className = "l " + cls[k];
      l.textContent = disp[k];
      span.appendChild(l);
    }
    return span;
  }

  function render(){
    var base = profi ? words.slice(profiStart) : words;
    var offset = profi ? profiStart : 0;
    var all = merge(base, live);
    var now = performance.now(), letterNo = 0;
    var frag = document.createDocumentFragment();

    all.forEach(function(w, i){
      var isLive = i >= base.length;
      var span = buildWord(w, isLive);
      if(!isLive && opt.anim && animFrom >= 0 && i + offset >= animFrom){
        Array.prototype.forEach.call(span.querySelectorAll(".l:not(.p)"), function(l){
          var d = letterNo * ANIM_STEP - (now - animStart);
          if(d > -450){ l.classList.add("ap"); l.style.animationDelay = Math.round(d) + "ms"; }
          letterNo++;
        });
      }
      frag.appendChild(span);
      frag.appendChild(document.createTextNode(" "));
    });

    textEl.replaceChildren(frag);
    textEl.classList.toggle("syl", opt.syl);
    textEl.classList.toggle("lined", opt.lines && all.length > 0);
    hintText.textContent = profi ? "Profi: Sag ein Wort und merk es dir gut!" : "Drück auf das rote Mikrofon und sag ein Wort.";
    hint.hidden = all.length > 0 || listening;
    cover.hidden = !(profi && phase === "hidden");
    undoBtn.disabled = words.length <= (profi ? profiStart : 0) || listening;
    clearBtn.disabled = words.length === 0 || listening;
    fit();
  }

  /* Schriftmaße für die Schreiblinien */
  var ctx = document.createElement("canvas").getContext("2d");
  function geom(F, L){
    ctx.font = F + "px " + getComputedStyle(textEl).fontFamily;
    var m = ctx.measureText("Hgh");
    var fA = m.fontBoundingBoxAscent || F * 0.95, fD = m.fontBoundingBoxDescent || F * 0.3;
    var asc = Math.max(ctx.measureText("H").actualBoundingBoxAscent || F * 0.7, ctx.measureText("hkl").actualBoundingBoxAscent || 0);
    var xh = ctx.measureText("x").actualBoundingBoxAscent || F * 0.5;
    var de = ctx.measureText("gjpqy").actualBoundingBoxDescent || F * 0.25;
    var yb = (L - (fA + fD)) / 2 + fA;
    return { yb: yb, top: yb - asc, mid: yb - xh, bot: yb + de, fA: fA, fD: fD };
  }
  function linesBackground(F, L){
    var g = geom(F, L), t = Math.max(1.5, F / 55);
    function r(y, h, c){ return "<rect x='0' y='" + y.toFixed(2) + "' width='10' height='" + h.toFixed(2) + "' fill='" + c + "'/>"; }
    var svg = "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 " + L.toFixed(2) + "' preserveAspectRatio='none'>" +
      r(g.mid, g.yb - g.mid, "#EEF3FB") +
      r(g.top - t / 2, t, "#A9BCDB") + r(g.mid - t / 2, t, "#A9BCDB") +
      r(g.yb - t, t * 2, "#5F7FB5") + r(g.bot - t / 2, t, "#A9BCDB") + "</svg>";
    return 'url("data:image/svg+xml,' + encodeURIComponent(svg) + '")';
  }

  // Schriftgröße so wählen, dass der Text die Fläche möglichst füllt
  function fit(){
    textEl.style.backgroundImage = "";
    textEl.style.lineHeight = "";
    if(!textEl.childNodes.length) return;
    var cs = getComputedStyle(stage);
    var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var lined = textEl.classList.contains("lined");
    var lh = lined ? 1.5 : 1.15;
    var lo = 16, hi = Math.max(16, Math.min(H / lh * 0.95, 380));
    for(var i = 0; i < 14; i++){
      var mid = (lo + hi) / 2;
      textEl.style.fontSize = mid + "px";
      if(textEl.scrollWidth <= W + 1 && textEl.scrollHeight <= H + 1) lo = mid; else hi = mid;
    }
    var F = Math.floor(lo), L = Math.round(F * lh);
    textEl.style.fontSize = F + "px";
    if(lined){
      textEl.style.lineHeight = L + "px";
      textEl.style.backgroundImage = linesBackground(F, L);
      textEl.style.backgroundSize = "100% " + L + "px";
    }
  }

  function toast(t, ms){
    msg.textContent = t; msg.hidden = false;
    clearTimeout(toast._t);
    if(ms) toast._t = setTimeout(function(){ msg.hidden = true; }, ms);
  }

  function setMic(on){
    listening = on;
    micBtn.classList.toggle("on", on);
    micBtn.innerHTML = on ? STOP_SVG : MIC_SVG;
    micBtn.setAttribute("aria-label", on ? "Aufhören" : "Sprechen");
    render();
  }

  function commit(){
    var start = words.length;
    if(live.trim()){
      words = merge(words, live);
      if(opt.punct) words = autoPunct(words, start);
      save();
    }
    live = "";
    if(words.length > start){
      animFrom = start; animStart = performance.now();
      if(profi) beginShow(start);
    }
    render();
  }

  /* ---------- Profi-Modus: ansehen – verdecken – aufschreiben – aufdecken ---------- */
  function clearPhase(){
    clearTimeout(phaseTimer); phaseTimer = null;
    timerBar.hidden = true;
  }
  function beginShow(start){
    clearPhase();
    var letters = words.slice(profiStart).join("").replace(/[^A-Za-zÄÖÜäöüß]/g, "").length;
    var dur = Math.min(12000, Math.max(3500, 2500 + 350 * letters));
    if(opt.anim) dur += (words.slice(start).join("").length) * ANIM_STEP;
    phase = "show";
    timerBar.hidden = false;
    timerBar.style.transition = "none";
    timerBar.style.width = "100%";
    void timerBar.offsetWidth;
    timerBar.style.transition = "width " + dur + "ms linear";
    timerBar.style.width = "0%";
    phaseTimer = setTimeout(function(){
      timerBar.hidden = true; phase = "hidden"; render();
    }, dur);
  }
  function newRound(){
    clearPhase();
    phase = "idle";
    profiStart = words.length;
  }
  revealBtn.addEventListener("click", function(){
    phase = "reveal"; animFrom = -1; render();
    speakWords();
  });
  profiBtn.addEventListener("click", function(){
    if(listening) return;
    profi = !profi;
    profiBtn.setAttribute("aria-pressed", String(profi));
    newRound();
    render();
  });

  /* ---------- Spracherkennung ---------- */
  function start(){
    stopSpeaking();
    if(profi) newRound();
    if(!SR){ startFallback(); return; }
    rec = new SR();
    rec.lang = "de-DE";
    rec.interimResults = true;
    rec.continuous = true;
    rec.maxAlternatives = 1;

    rec.onresult = function(e){
      var s = "";
      for(var i = 0; i < e.results.length; i++){
        var t = (e.results[i][0].transcript || "").trim();
        if(!t) continue;
        // Safari liefert manchmal den ganzen bisherigen Satz erneut – dann ersetzen statt doppeln
        if(s && t.toLowerCase().indexOf(s.toLowerCase()) === 0) s = t;
        else s = s ? s + " " + t : t;
      }
      live = s;
      render();
    };
    rec.onerror = function(e){
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){
        toast("Das Mikrofon ist nicht erlaubt. Bitte in Safari unter „aA“ → Website-Einstellungen → Mikrofon auf „Erlauben“ stellen.", 0);
      }else if(e.error === "network"){
        toast("Keine Internetverbindung. Die Spracherkennung braucht Internet.", 5000);
      }else if(e.error === "no-speech"){
        toast("Ich habe nichts gehört. Versuch es nochmal!", 3000);
      }
    };
    rec.onend = function(){ rec = null; listening = false; commit(); setMic(false); };

    try{ rec.start(); setMic(true); msg.hidden = true; }
    catch(err){ setMic(false); }
  }
  function stop(){
    if(rec){ try{ rec.stop(); }catch(e){ rec = null; listening = false; commit(); setMic(false); } }
    else if(listening){ listening = false; commit(); setMic(false); fallback.blur(); }
  }

  /* Ersatz: Diktierfunktion der iPad-Tastatur */
  function startFallback(){
    fallback.value = "";
    fallback.focus();
    setMic(true);
    toast("Tippe auf der Tastatur auf das Mikrofon und sprich.", 4000);
  }
  fallback.addEventListener("input", function(){ live = fallback.value; render(); });
  fallback.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); stop(); } });
  fallback.addEventListener("blur", function(){ if(!rec && listening){ listening = false; commit(); setMic(false); } });

  micBtn.addEventListener("click", function(){
    keepAwake();
    if(listening) stop(); else start();
  });

  /* ---------- Vorlesen: Laute, Buchstabieren, ganze Wörter ---------- */
  var LAUTE = {
    "a":"a", "e":"e", "i":"i", "o":"o", "u":"u", "ä":"ä", "ö":"ö", "ü":"ü", "y":"ü",
    "b":"bö", "c":"kö", "d":"dö", "f":"fff", "g":"gö", "h":"hö", "j":"jö", "k":"kö", "l":"lll",
    "m":"mmm", "n":"nnn", "p":"pö", "q":"kwö", "r":"rrr", "s":"sss", "t":"tö", "v":"fff",
    "w":"wö", "x":"ks", "z":"ts", "ß":"sss",
    "sch":"schhh", "ch":"ch", "ck":"kö", "ei":"ei", "ai":"ei", "au":"au", "eu":"eu", "äu":"eu", "ie":"ii", "qu":"kwö", "pf":"pf"
  };
  var LAUTGRUPPEN = ["sch","äu","ch","ck","ei","ai","au","eu","ie","qu","pf"];
  var NAMEN = {
    "a":"A", "b":"Be", "c":"Ze", "d":"De", "e":"E", "f":"Eff", "g":"Ge", "h":"Ha", "i":"I", "j":"Jott",
    "k":"Ka", "l":"El", "m":"Em", "n":"En", "o":"O", "p":"Pe", "q":"Ku", "r":"Er", "s":"Es", "t":"Te",
    "u":"U", "v":"Vau", "w":"We", "x":"Ix", "y":"Üpsilon", "z":"Zett", "ä":"Ä", "ö":"Ö", "ü":"Ü", "ß":"Eszett"
  };

  var voice = null;
  function pickVoice(){
    if(!("speechSynthesis" in window)) return;
    var vs = speechSynthesis.getVoices().filter(function(v){ return /^de/i.test(v.lang); });
    voice = vs.filter(function(v){ return /anna|petra|helena|marlene/i.test(v.name); })[0] || vs[0] || null;
  }
  if("speechSynthesis" in window){
    pickVoice();
    speechSynthesis.addEventListener && speechSynthesis.addEventListener("voiceschanged", pickVoice);
  }

  function clearHighlights(){
    Array.prototype.forEach.call(textEl.querySelectorAll(".hl,.speaking"), function(n){ n.classList.remove("hl", "speaking"); });
  }
  function stopSpeaking(){
    if("speechSynthesis" in window) speechSynthesis.cancel();
    clearHighlights();
  }
  // items: [{text, els, cls, rate}]
  function speakSeq(items){
    if(!("speechSynthesis" in window) || !items.length) return;
    stopSpeaking();
    setTimeout(function(){
      items.forEach(function(it){
        var u = new SpeechSynthesisUtterance(it.text);
        u.lang = "de-DE"; u.rate = it.rate || 0.8;
        if(voice) u.voice = voice;
        u.onstart = function(){ it.els.forEach(function(n){ n.classList.add(it.cls); }); };
        u.onend = u.onerror = function(){ it.els.forEach(function(n){ n.classList.remove(it.cls); }); };
        speechSynthesis.speak(u);
      });
    }, 60);
  }

  function letterEls(w){ return Array.prototype.slice.call(w.querySelectorAll(".l:not(.p)")); }

  function sayWord(w){
    speakSeq([{ text: w.dataset.word.replace(PUNCT_END, ""), els: [w], cls: "speaking", rate: 0.8 }]);
  }
  function spellWord(w){
    var items = letterEls(w).map(function(l){
      var c = l.textContent.toLowerCase();
      return { text: NAMEN[c] || c, els: [l], cls: "hl", rate: 0.85 };
    });
    items.push({ text: w.dataset.word.replace(PUNCT_END, ""), els: [w], cls: "speaking", rate: 0.8 });
    speakSeq(items);
  }
  function sayLaut(w, l){
    var ls = letterEls(w);
    var s = ls.map(function(n){ return n.textContent.toLowerCase(); }).join("");
    var i = ls.indexOf(l), from = i, len = 1;
    for(var g = 0; g < LAUTGRUPPEN.length; g++){
      var grp = LAUTGRUPPEN[g], found = false;
      for(var st = Math.max(0, i - grp.length + 1); st <= i; st++){
        if(s.substr(st, grp.length) === grp){ from = st; len = grp.length; found = true; break; }
      }
      if(found) break;
    }
    var key = s.substr(from, len);
    speakSeq([{ text: LAUTE[key] || key, els: ls.slice(from, from + len), cls: "hl", rate: 0.7 }]);
  }
  // Alle sichtbaren Wörter nacheinander vorlesen (nach dem Aufdecken im Profi-Modus)
  function speakWords(){
    var ws = Array.prototype.filter.call(textEl.querySelectorAll(".w"), function(w){ return !w.classList.contains("masked"); });
    speakSeq(ws.map(function(w){ return { text: w.dataset.word.replace(PUNCT_END, ""), els: [w], cls: "speaking", rate: 0.8 }; }));
  }

  textEl.addEventListener("click", function(e){
    if(listening) return;
    var w = e.target.closest(".w");
    if(!w || w.classList.contains("live") || w.classList.contains("masked")) return;
    if(spell){ spellWord(w); return; }
    var l = e.target.closest(".l");
    if(l && !l.classList.contains("p")) sayLaut(w, l); else sayWord(w);
  });

  /* ---------- Knöpfe ---------- */
  function setUpper(v){
    upper = v;
    modeNormal.setAttribute("aria-pressed", String(!v));
    modeUpper.setAttribute("aria-pressed", String(v));
    animFrom = -1;
    save(); render();
  }
  modeNormal.addEventListener("click", function(){ setUpper(false); });
  modeUpper.addEventListener("click", function(){ setUpper(true); });

  spellBtn.addEventListener("click", function(){
    spell = !spell;
    spellBtn.setAttribute("aria-pressed", String(spell));
    toast(spell ? "Tippe auf ein Wort: Es wird buchstabiert." : "Tippe auf einen Buchstaben: Du hörst seinen Laut.", 2500);
    save();
  });

  undoBtn.addEventListener("click", function(){
    if(words.length <= (profi ? profiStart : 0)) return;
    stopSpeaking();
    words.pop(); animFrom = -1;
    if(profi && words.length <= profiStart){ clearPhase(); phase = "idle"; }
    save(); render();
  });

  // Alles löschen: zweimal tippen, damit nichts aus Versehen verschwindet
  var armTimer = null;
  clearBtn.addEventListener("click", function(){
    if(clearBtn.classList.contains("armed")){
      clearTimeout(armTimer); clearBtn.classList.remove("armed");
      stopSpeaking();
      words = []; animFrom = -1; newRound();
      save(); render();
    }else{
      clearBtn.classList.add("armed");
      armTimer = setTimeout(function(){ clearBtn.classList.remove("armed"); }, 2500);
    }
  });

  /* ---------- Einstellungen ---------- */
  function openPanel(){
    for(var k in optEls) optEls[k].checked = opt[k];
    scrim.hidden = false;
  }
  function closePanel(){ scrim.hidden = true; }
  gearBtn.addEventListener("click", openPanel);
  closeBtn.addEventListener("click", closePanel);
  scrim.addEventListener("click", function(e){ if(e.target === scrim) closePanel(); });
  Object.keys(optEls).forEach(function(k){
    optEls[k].addEventListener("change", function(){
      opt[k] = optEls[k].checked; animFrom = -1; save(); render();
    });
  });

  /* ---------- Arbeitsblatt ---------- */
  function buildRow(F, L, word){
    var g = geom(F, L);
    var row = document.createElement("div");
    row.className = "row"; row.style.height = L + "px";
    function add(cls, top, h){
      var d = document.createElement("div");
      d.className = cls; d.style.top = top.toFixed(1) + "px";
      if(h !== undefined) d.style.height = h.toFixed(1) + "px";
      row.appendChild(d);
    }
    add("band", g.mid, g.yb - g.mid);
    add("ln", g.top); add("ln", g.mid); add("ln base", g.yb - 1); add("ln", g.bot);
    if(word){
      var tx = buildWord(word, false);
      tx.classList.add("tx");
      tx.style.fontSize = F + "px";
      tx.style.top = (g.yb - g.fA).toFixed(1) + "px";
      tx.style.lineHeight = (g.fA + g.fD).toFixed(1) + "px";
      row.appendChild(tx);
    }
    return row;
  }
  function buildSheet(){
    var seen = {}, list = [];
    words.forEach(function(w){
      var c = w.replace(PUNCT_END, "");
      if(!c || c.indexOf(MASKE) === 0) return;
      var k = c.toLowerCase();
      if(seen[k]) return;
      seen[k] = true; list.push(c);
    });
    if(!list.length) return false;
    sheet.replaceChildren();
    sheet.classList.toggle("syl", opt.syl);
    var head = document.createElement("div");
    head.className = "ws-head";
    head.innerHTML = "<h1>Meine Wörter</h1>";
    var date = document.createElement("span");
    date.textContent = new Date().toLocaleDateString("de-DE", { day:"numeric", month:"long", year:"numeric" });
    head.appendChild(date);
    sheet.appendChild(head);
    var F = 60, L = 104;   // ca. 1,5 cm von der Ober- bis zur Unterlinie
    list.forEach(function(w){
      var item = document.createElement("div");
      item.className = "ws-item";
      item.appendChild(buildRow(F, L, w));
      item.appendChild(buildRow(F, L));
      item.appendChild(buildRow(F, L));
      sheet.appendChild(item);
    });
    return true;
  }
  printBtn.addEventListener("click", function(){
    if(!buildSheet()){ closePanel(); toast("Es gibt noch keine Wörter zum Drucken.", 3000); return; }
    closePanel();
    setTimeout(function(){ window.print(); }, 100);
  });

  /* Bildschirm anlassen, solange die App offen ist */
  var lock = null;
  function keepAwake(){
    if(lock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock = l; l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") keepAwake();
    else{ if(listening) stop(); stopSpeaking(); }
  });

  window.addEventListener("resize", function(){ fit(); });
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ fit(); });

  load();
  spellBtn.setAttribute("aria-pressed", String(spell));
  setUpper(upper);

  // für Tests
  window.__wm = { merge: merge, autoPunct: autoPunct, syllableClasses: syllableClasses, isBad: isBad };
})();
</script>
