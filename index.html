<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Wortmaler">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F4F7FB">
<title>Wortmaler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Layout: ein Bildschirm – kleine Leiste oben, riesige Schreibfläche, Mikrofon unten mittig */
  :root{
    --paper:#F4F7FB;      /* Hintergrund */
    --sheet:#FFFFFF;      /* Schreibfläche */
    --ink:#1D2742;        /* fertige Wörter */
    --ink-live:#9AA6BF;   /* Wort, das gerade erkannt wird */
    --line:#DDE4EF;       /* Ränder, Knöpfe */
    --mic:#F2603F;        /* Mikrofon */
    --mic-on:#D93B1B;
    --ok:#2E7D5B;
    --font-kid:"Andika","Andika New Basic","Comic Neue",system-ui,-apple-system,sans-serif;
    --font-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--paper);color:var(--ink);font-family:var(--font-ui);
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    touch-action:manipulation;overflow:hidden;
  }
  .app{
    height:100%;display:grid;grid-template-rows:auto 1fr auto;gap:16px;
    padding-top:max(16px, env(safe-area-inset-top,0px));
    padding-bottom:max(16px, env(safe-area-inset-bottom,0px));
    padding-left:max(16px, env(safe-area-inset-left,0px));
    padding-right:max(16px, env(safe-area-inset-right,0px));
  }

  /* Obere Leiste */
  .bar{display:flex;justify-content:space-between;align-items:center;gap:16px}
  .toggle{
    display:flex;background:var(--sheet);border:2px solid var(--line);border-radius:999px;padding:4px;gap:4px;
  }
  .toggle button{
    font-family:var(--font-kid);font-size:28px;font-weight:700;color:var(--ink-live);
    background:none;border:0;border-radius:999px;min-width:96px;height:56px;padding:0 18px;cursor:pointer;
    transition:background .2s,color .2s;
  }
  .toggle button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
  .round{
    width:64px;height:64px;border-radius:50%;border:2px solid var(--line);background:var(--sheet);
    display:grid;place-items:center;cursor:pointer;color:var(--ink);transition:background .2s,border-color .2s,color .2s;
  }
  .round svg{width:30px;height:30px}
  .round:disabled{opacity:.35}
  .round.armed{background:var(--mic-on);border-color:var(--mic-on);color:#fff}
  button:focus-visible{outline:4px solid #7AA7FF;outline-offset:3px}

  /* Schreibfläche */
  .stage{
    position:relative;min-height:0;background:var(--sheet);border-radius:28px;border:2px solid var(--line);
    padding:clamp(16px,3vw,40px);overflow:hidden;display:flex;align-items:center;justify-content:center;
  }
  .text{
    font-family:var(--font-kid);font-weight:400;line-height:1.15;text-align:center;
    max-width:100%;overflow-wrap:normal;word-break:keep-all;hyphens:none;
  }
  .w{display:inline-block;padding:0 .12em;border-radius:.15em;transition:color .25s,background .25s;cursor:pointer}
  .w.live{color:var(--ink-live)}
  .w.speaking{background:#FFF0B8}
  .w.pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(.85);opacity:.4}to{transform:none;opacity:1}}

  .hint{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
    color:var(--ink-live);font-size:20px;text-align:center;padding:24px;pointer-events:none;
  }
  .hint svg{width:120px;height:120px;color:var(--line)}
  .msg{
    position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 32px);
    background:var(--ink);color:#fff;font-size:17px;line-height:1.4;padding:12px 18px;border-radius:14px;text-align:center;
  }

  /* Untere Leiste */
  .controls{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
  .controls .left{justify-self:start}
  .controls .right{justify-self:end}
  .mic{
    position:relative;width:112px;height:112px;border-radius:50%;border:0;cursor:pointer;
    background:var(--mic);color:#fff;display:grid;place-items:center;
    box-shadow:0 6px 0 #C2462A;transition:transform .1s,box-shadow .1s,background .2s;
  }
  .mic:active{transform:translateY(4px);box-shadow:0 2px 0 #C2462A}
  .mic svg{width:52px;height:52px;position:relative;z-index:1}
  .mic.on{background:var(--mic-on);box-shadow:0 6px 0 #9E2A12}
  .mic.on::before,.mic.on::after{
    content:"";position:absolute;inset:0;border-radius:50%;border:4px solid var(--mic);animation:ring 1.6s ease-out infinite;
  }
  .mic.on::after{animation-delay:.8s}
  @keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.6);opacity:0}}
  @media (prefers-reduced-motion:reduce){
    .mic.on::before,.mic.on::after{animation:none;opacity:.5;transform:scale(1.2)}
    .w.pop{animation:none}
  }

  /* Ersatz-Eingabe, falls der Browser keine Spracherkennung hat */
  .fallback{position:absolute;opacity:0;pointer-events:none;width:1px;height:1px;font-size:16px}
</style>
</head>
<body>
<div class="app">
  <div class="bar">
    <div class="toggle" role="group" aria-label="Schreibweise">
      <button id="modeNormal" type="button" aria-pressed="true">Abc</button>
      <button id="modeUpper" type="button" aria-pressed="false">ABC</button>
    </div>
    <button id="clearBtn" class="round" type="button" aria-label="Alles löschen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></svg>
    </button>
  </div>

  <main class="stage" id="stage">
    <div class="text" id="text" aria-live="polite"></div>
    <div class="hint" id="hint">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
      <div>Drück auf das rote Mikrofon und sag ein Wort.</div>
    </div>
    <div class="msg" id="msg" hidden></div>
    <input id="fallback" class="fallback" type="text" autocomplete="off" autocorrect="off" spellcheck="false" lang="de">
  </main>

  <div class="controls">
    <button id="undoBtn" class="round left" type="button" aria-label="Letztes Wort löschen">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1z"/><path d="M17 9l-5 6M12 9l5 6"/></svg>
    </button>
    <button id="micBtn" class="mic" type="button" aria-label="Sprechen">
      <svg id="micIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/></svg>
    </button>
    <span class="right"></span>
  </div>
</div>

<script>
(function(){
  "use strict";

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var $ = function(id){ return document.getElementById(id); };
  var stage = $("stage"), textEl = $("text"), hint = $("hint"), msg = $("msg");
  var micBtn = $("micBtn"), undoBtn = $("undoBtn"), clearBtn = $("clearBtn");
  var modeNormal = $("modeNormal"), modeUpper = $("modeUpper"), fallback = $("fallback");

  var MIC_SVG = micBtn.innerHTML;
  var STOP_SVG = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2.5" fill="currentColor"/></svg>';

  var words = [];        // fertige Wörter
  var live = "";         // gerade erkannter Text
  var upper = false;
  var listening = false;
  var rec = null;
  var lastCount = 0;

  /* ---------- Speichern (nur auf diesem Gerät) ---------- */
  function save(){
    try{ localStorage.setItem("wortmaler", JSON.stringify({words:words, upper:upper})); }catch(e){}
  }
  function load(){
    try{
      var d = JSON.parse(localStorage.getItem("wortmaler") || "null");
      if(d && Array.isArray(d.words)){ words = d.words.filter(function(w){return typeof w==="string";}); upper = !!d.upper; }
    }catch(e){}
  }

  /* ---------- Text aufbereiten ---------- */
  function cleanWords(str){
    return str
      .replace(/[.,!?;:"„“”«»()]/g, " ")
      .split(/\s+/)
      .filter(function(w){ return w.length > 0; });
  }
  function show(w){
    if(!upper) return w;
    // ß wird zum großen ẞ statt zu "SS"
    return w.replace(/ß/g, "ẞ").toLocaleUpperCase("de-DE");
  }

  /* ---------- Darstellung ---------- */
  function render(){
    var liveWords = cleanWords(live);
    var frag = document.createDocumentFragment();
    var all = words.concat(liveWords);
    all.forEach(function(w, i){
      var s = document.createElement("span");
      s.className = "w" + (i >= words.length ? " live" : "");
      if(i < words.length && i >= lastCount) s.className += " pop";
      s.textContent = show(w);
      s.dataset.word = w;
      frag.appendChild(s);
      frag.appendChild(document.createTextNode(" "));
    });
    lastCount = words.length;
    textEl.replaceChildren(frag);
    hint.hidden = all.length > 0 || listening;
    undoBtn.disabled = words.length === 0 || listening;
    clearBtn.disabled = words.length === 0 || listening;
    fit();
  }

  // Schriftgröße so wählen, dass der Text die Fläche möglichst füllt
  function fit(){
    if(!textEl.childNodes.length) return;
    var cs = getComputedStyle(stage);
    var W = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    var H = stage.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
    var lo = 16, hi = Math.max(16, Math.min(H * 0.8, 420));
    for(var i = 0; i < 14; i++){
      var mid = (lo + hi) / 2;
      textEl.style.fontSize = mid + "px";
      if(textEl.scrollWidth <= W + 1 && textEl.scrollHeight <= H + 1) lo = mid; else hi = mid;
    }
    textEl.style.fontSize = Math.floor(lo) + "px";
  }

  function toast(t, ms){
    msg.textContent = t; msg.hidden = false;
    clearTimeout(toast._t);
    if(ms) toast._t = setTimeout(function(){ msg.hidden = true; }, ms);
  }

  function setMic(on){
    listening = on;
    micBtn.classList.toggle("on", on);
    micBtn.innerHTML = on ? STOP_SVG : MIC_SVG;
    micBtn.setAttribute("aria-label", on ? "Aufhören" : "Sprechen");
    render();
  }

  function commit(){
    var nw = cleanWords(live);
    live = "";
    if(nw.length){ words = words.concat(nw); save(); }
    render();
  }

  /* ---------- Spracherkennung ---------- */
  function start(){
    if(!SR){ startFallback(); return; }
    try{ speechSynthesis.cancel(); }catch(e){}
    rec = new SR();
    rec.lang = "de-DE";
    rec.interimResults = true;
    rec.continuous = true;
    rec.maxAlternatives = 1;

    rec.onresult = function(e){
      var s = "";
      for(var i = 0; i < e.results.length; i++){
        var t = (e.results[i][0].transcript || "").trim();
        if(!t) continue;
        // Safari liefert manchmal den ganzen bisherigen Satz erneut – dann ersetzen statt doppeln
        if(s && t.toLowerCase().indexOf(s.toLowerCase()) === 0) s = t;
        else s = s ? s + " " + t : t;
      }
      live = s;
      render();
    };
    rec.onerror = function(e){
      if(e.error === "not-allowed" || e.error === "service-not-allowed"){
        toast("Das Mikrofon ist nicht erlaubt. Bitte in Safari unter „aA“ → Website-Einstellungen → Mikrofon auf „Erlauben“ stellen.", 0);
      }else if(e.error === "network"){
        toast("Keine Internetverbindung. Die Spracherkennung braucht Internet.", 5000);
      }else if(e.error === "no-speech"){
        toast("Ich habe nichts gehört. Versuch es nochmal!", 3000);
      }
    };
    rec.onend = function(){ commit(); setMic(false); rec = null; };

    try{ rec.start(); setMic(true); msg.hidden = true; }
    catch(err){ setMic(false); }
  }
  function stop(){
    if(rec){ try{ rec.stop(); }catch(e){ commit(); setMic(false); } }
    else if(listening){ commit(); setMic(false); fallback.blur(); }
  }

  /* Ersatz: Diktierfunktion der iPad-Tastatur */
  function startFallback(){
    fallback.value = "";
    fallback.focus();
    setMic(true);
    toast("Tippe auf der Tastatur auf das Mikrofon und sprich.", 4000);
  }
  fallback.addEventListener("input", function(){ live = fallback.value; render(); });
  fallback.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); stop(); } });
  fallback.addEventListener("blur", function(){ if(!rec && listening){ commit(); setMic(false); } });

  micBtn.addEventListener("click", function(){
    keepAwake();
    if(listening) stop(); else start();
  });

  /* ---------- Knöpfe ---------- */
  function setUpper(v){
    upper = v;
    modeNormal.setAttribute("aria-pressed", String(!v));
    modeUpper.setAttribute("aria-pressed", String(v));
    lastCount = words.length;
    save(); render();
  }
  modeNormal.addEventListener("click", function(){ setUpper(false); });
  modeUpper.addEventListener("click", function(){ setUpper(true); });

  undoBtn.addEventListener("click", function(){
    if(!words.length) return;
    words.pop(); lastCount = words.length; save(); render();
  });

  // Alles löschen: zweimal tippen, damit nichts aus Versehen verschwindet
  var armTimer = null;
  clearBtn.addEventListener("click", function(){
    if(clearBtn.classList.contains("armed")){
      clearTimeout(armTimer); clearBtn.classList.remove("armed");
      words = []; lastCount = 0; save(); render();
    }else{
      clearBtn.classList.add("armed");
      armTimer = setTimeout(function(){ clearBtn.classList.remove("armed"); }, 2500);
    }
  });

  /* Wort antippen: wird vorgelesen */
  textEl.addEventListener("click", function(e){
    var s = e.target.closest(".w");
    if(!s || listening || !("speechSynthesis" in window)) return;
    speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(s.dataset.word);
    u.lang = "de-DE"; u.rate = 0.8;
    var v = speechSynthesis.getVoices().filter(function(x){ return /^de/i.test(x.lang); })[0];
    if(v) u.voice = v;
    s.classList.add("speaking");
    u.onend = u.onerror = function(){ s.classList.remove("speaking"); };
    speechSynthesis.speak(u);
  });

  /* Bildschirm anlassen, solange die App offen ist */
  var lock = null;
  function keepAwake(){
    if(lock || !navigator.wakeLock) return;
    navigator.wakeLock.request("screen").then(function(l){
      lock = l; l.addEventListener("release", function(){ lock = null; });
    }).catch(function(){});
  }
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible") keepAwake();
    else if(listening) stop();
  });

  window.addEventListener("resize", fit);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  load();
  setUpper(upper);
})();
</script>
</body>
</html>
